<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D&D AI Dungeon Master</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #ffffff !important;
        color: #000000;
      }
      html.dark,
      html.dark body {
        background-color: #1a1a1a !important;
        color: #ffffff;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // 非 iframe 环境，使用默认 light 主题
          applyThemeToDOM("light");
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>

eeper:!0,secret:"Его кузница стоит на месте древнего храма",dialogue:["Ха! Ещё один искатель приключений!","Мой молот не знает пощады!","Лучшее оружие — у меня в кузнице!","Предки шепчут мне о надвигающейся беде..."]},{name:"Лирэль Лунная Тень",description:"Загадочная эльфийка с серебристыми волосами и зелёными глазами, светящимися в темноте",disposition:"mysterious",questGiver:!0,secret:"Она — принцесса изгнанных эльфов, скрывающаяся от убийц",dialogue:["Луна шепчет мне твоё имя...","Тёмные времена грядут, герой...","Я видела твою судьбу в звёздах...","Доверяй теням — они вернее света..."]},{name:"Гримбальд Чёрный Клык",description:"Наёмник с шрамом через всё лицо и холодным взглядом, в потёртой кольчуге",disposition:"neutral",questGiver:!0,secret:"Работает на тайную организацию, планирующую переворот",dialogue:["Работа есть для тех, у кого хватит смелости...","Золото — мой единственный бог.","Не задавай вопросов, если хочешь жить долго.","Я видел вещи, от которых у тебя волосы встанут дыбом..."]},{name:"Сестра Милисента",description:"Жрица в белых одеждах с символом солнца на груди, излучающая покой",disposition:"friendly",questGiver:!0,secret:"Потеряла веру после смерти семьи, но скрывает это",dialogue:["Да пребудет с тобой свет, дитя моё...","Храм нуждается в помощи...","Зло распространяется, мы должны действовать!","Боги испытывают нас, но не оставляют..."]},{name:"Зара Тёмная",description:"Ведьма с вороном на плече и странными амулетами, живущая в хижине на курьих ножках",disposition:"mysterious",questGiver:!0,shopkeeper:!0,secret:"На самом деле — замаскированная hag (карга), но помогает из своих интересов",dialogue:["Мой котёл видит будущее...","Хочешь зелье? У меня есть всё...","Осторожнее с желаниями, милый...","Ворон принёс весть — грядёт буря..."]},{name:"Капитан Родрик",description:"Седой ветеран с множеством наград и усталым взглядом, командующий городской стражей",disposition:"friendly",questGiver:!0,secret:"Его сын пропал при исполнении, и он ищет его",dialogue:["Солдат, мне нужна твоя помощь!","Враг у ворот, мы должны действовать!","За короля и родину!","Я видел слишком много смертей на этой войне..."]},{name:"Финдук Полурослик",description:"Весёлый полурослик с огромным рюкзаком и улыбкой до ушей, торгующий на дорогах",disposition:"friendly",shopkeeper:!0,secret:"Контрабандист, но только запрещённых книг",dialogue:["О, чудесный день для торговли!","У меня есть вещи, которые вы не найдёте больше нигде!","Скидка для друзей!","Знаете, в тех горах я видел кое-что интересное..."]},{name:"Призрак Леди Изабель",description:"Прозрачная фигура женщины в старинном платье, парящая над полом замка",disposition:"mysterious",questGiver:!0,secret:"Убита собственным мужем 200 лет назад, её дух привязан к медальону",dialogue:["Помоги мне обрести покой...","Он предал меня... отомсти за меня...","Найди мой медальон...","Стены помнят мои крики..."]},{name:"Дракон-метаморф Векс",description:"Загадочный незнакомец с вертикальными зрачками и неестественно бледной кожей",disposition:"mysterious",questGiver:!0,secret:"На самом деле — серебряный дракон, защищающий регион от вторжения",dialogue:["Интересный экземпляр...","Я видел многое за свои... годы...","Судьба мира в ваших руках, смертные.","Будьте осторожны — не всё золото то, что блестит..."]},{name:"Мастер Шэдоу",description:"Ниндзя в чёрном, чьё лицо скрыто маской. Движется бесшумно",disposition:"neutral",questGiver:!0,secret:"Лидер гильдии убийц, но следует строгому кодексу чести",dialogue:["Тишина — лучший друг воина...","Я научу тебя, если докажешь свою ценность...","Тени не лгут.","Смерть приходит без предупреждения..."]},{name:"Профессор Арканиус",description:"Рассеянный учёный в очках с толстыми линзами, окружённый книгами",disposition:"friendly",questGiver:!0,secret:"Открыл портал в Бездну, но пытается это скрыть",dialogue:["Ах, молодой искатель знаний!","Эта книга содержит великие тайны...","Осторожнее с артефактами, они могут быть опасны!","Мои исследования почти завершены... почти..."]},{name:"Король Трон",description:"Могучий воин-король в золотой короне и латах, правящий железной рукой",disposition:"neutral",questGiver:!0,secret:"Болен неизлечимой болезнью, скрывает это от всех",dialogue:["Говори, подданный.","Королевство нуждается в верных воинах.","Моя власть — моя ответственность.","Предательство карается смертью..."]},{name:"Мадам Фортuna",description:"Гадалка-циганка с картами Таро и хрустальным шаром",disposition:"mysterious",questGiver:!0,secret:"На самом деле — агент тайной полиции, но иногда говорит правду",dialogue:["Карты говорят... интересно...","Вижу опасность в твоём будущем...","За монету я расскажу больше...","Судьба неумолима, но её можно изменить..."]},{name:"Грок",description:"Полуорк-гладиатор с огромными мускулами и добрыми глазами",disposition:"friendly",questGiver:!1,secret:"Бывший наёмник, ставший гладиатором, чтобы заработать свободу для семьи",dialogue:["Арена — мой дом.","Сильный не тот, кто бьёт, а тот, кто защищает.","Хочешь совет? Бей первым.","Мои братья ждут, когда я куплю их свободу..."]}],Uo=[{name:"Тёмный лес Шепчущих Деревьев",description:"Деревья здесь шепчут древние тайны. Туман стелется между стволами, а корни шевелятся, когда ты отводишь взгляд. Говорят, лес живой — и он наблюдает.",danger:"medium"},{name:'Заброшенная таверна "Сломанный Меч"',description:"Пыльные столы и разбитые кружки. Когда-то здесь кипела жизнь, но теперь только ветер гуляет между пустых бутылок. На стене — карта с отмеченными крестами.",danger:"low"},{name:"Кристальные пещеры",description:"Подземелье, освещённое мерцающими кристаллами всех цветов радуги. Каждый кристалл издаёт тихий звон, создавая мелодию. Некоторые кристаллы пульсируют в такт твоему сердцу.",danger:"medium"},{name:"Горная тропа к Храму Ветров",description:"Узкая тропа вдоль обрыва. Ветер воет между скалами, пытаясь столкнуть тебя вниз. Вдалеке виднеется храм, парящий над вершиной.",danger:"high"},{name:"Болота Гнилой Топи",description:"Зловонный туман. Пузыри газа поднимаются из чёрной воды. Деревья искривлены, а из воды иногда вылезают бледные руки.",danger:"high"},{name:"Подземный город Унтервир",description:"Город дроу, освещённый магическим светом. Тёмная красота чёрных башен контрастирует с жестокостью обитателей. Рабы трудятся на улицах.",danger:"very_high"},{name:"Руины замка Вороньей Скалы",description:"Разрушенный замок на вершине утёса. Вороньи гнёзда повсюду. Стены покрыты странными рунами, которые светятся в полнолуние.",danger:"medium"},{name:"Рыночная площадь Ватердипа",description:"Шумная площадь, полная торговцев, покупателей и бродяг. Запах специй смешивается с ароматом жареного мяса. Карманники снуют между толпой.",danger:"low"},{name:"Великая Библиотека Кандлкипа",description:"Бесконечные полки с книгами. Запах пергамента и пыли. Тихие монахи перемещаются между стеллажами. Здесь хранятся знания тысячелетий.",danger:"low"},{name:"Логово Дракона Пепельной Горы",description:"Воздух раскалён. Кости жертв хрустят под ногами. Стены пещеры покрыты сажей и золотом. Где-то в глубине слышно тяжёлое дыхание.",danger:"very_high"},{name:'Таверна "Отдыхающий путник"',description:"Уютная таверна с камином и запахом жареного мяса. Бард играет на лютне в углу. Хозяйка — добродушная полурослица — наливает эль.",danger:"low"},{name:"Заброшенные шахты Фанданте",description:"Тёмные тоннели, где когда-то добывали мифрил. Рельсы ржавые, вагонетки перевёрнуты. Из глубины доносится стук кирок — но шахты давно заброшены.",danger:"high"},{name:"Храм Забытого Бога",description:"Древний храм с разрушенными статуями. Магия всё ещё пульсирует в стенах. Алтарь покрыт пылью, но свечи горят сами собой.",danger:"medium"},{name:"Порт Чёрной Воды",description:"Пиратский порт с подозрительными типами в каждой тени. Корабли с чёрными парусами покачиваются на волнах. Таверны полны пьяных матросов.",danger:"medium"},{name:"Эльфийские руины Сильванести",description:"Разрушенные эльфийские башни, поросшие мхом и плющом. Даже в руинах чувствуется магия. Деревья вокруг цветут, хотя на дворе зима.",danger:"medium"},{name:"Арена Крови",description:"Гладиаторская арена. Крики толпы оглушают. Песок пропитан кровью. В клетках рычат чудовища, ожидающие своего выхода.",danger:"high"},{name:"Лесная поляна Дриад",description:"Волшебная поляна, где танцуют феи. Воздух наполнен магией и ароматом цветов. Деревья кланяются тебе, а ручей поёт мелодию.",danger:"low"},{name:"Гробница Древних Королей",description:"Каменные саркофаги. Мумии спят вечным сном. На стенах — фрески, рассказывающие о забытых войнах. Воздух сухой и пахнет вечностью.",danger:"very_high"},{name:"Парящие острова Зефира",description:"Острова, парящие в небе, соединённые мостами из облаков. Водопады стекают в пустоту. Здесь живут воздушные элементали и птицы-гиганты.",danger:"high"},{name:"Подводный город Мерфолии",description:"Город на дне океана, защищённый магическим куполом. Коралловые здания светятся изнутри. Рыбы-гиганты плавают между башнями.",danger:"medium"},{name:"Пустошь Мёртвых Земель",description:"Выжженная земля, где когда-то стоял великий город. Теперь здесь только пепел и кости. Небо всегда серое, а солнце не проникает сквозь облака.",danger:"very_high"},{name:"Серебряный лес Эльфхейма",description:"Лес с серебряными деревьями и золотыми листьями. Эльфы живут в гармонии с природой. Воздух чист и наполнен магией. Здесь время течёт иначе.",danger:"low"},{name:"Канализация Подземного Города",description:"Тёмные тоннели, полные крыс и нечистот. Здесь скрываются изгнанники и cultists. Стены покрыты странными символами.",danger:"high"},{name:"Ледяные пустоши Рауквина",description:"Бескрайняя тундра, покрытая вечным льдом. Ветер режет как нож. Вдалеке виднеются ледяные великаны. Северное сияние танцует в небе.",danger:"high"},{name:"Вулкан Огненной Горы",description:"Активный вулкан с реками лавы. Жар нестерпим. Здесь живут саламандры и огненные элементали. В глубине — кузница гигантов.",danger:"very_high"},{name:"Грибной лес Миркорра",description:"Лес из гигантских грибов, достигающих 50 футов в высоту. Споры создают радужную дымку. Здесь живут грибные существа и странные твари.",danger:"medium"},{name:"Некромантская башня",description:"Чёрная башня, окружённая кольцом мёртвых деревьев. Молнии бьют в её шпиль даже в ясную погоду. Из окон доносится зловещий смех.",danger:"very_high"},{name:"Друидская роща",description:"Священная роща с древними дубами. В центре — камень, на котором друиды проводят ритуалы. Животные не боятся тебя здесь.",danger:"low"},{name:"Город воров Шэдоуглуб",description:"Город, построенный в каньоне. Узкие улочки, тёмные переулки. Здесь правит гильдия воров, а закон — только для тех, кто может заплатить.",danger:"high"},{name:"Озеро Загадок",description:"Кристально чистое озеро в центре гор. На дне видны руины затонувшего храма. По ночам из воды поднимается свет.",danger:"medium"},{name:"Планарный перекрёсток",description:"Место, где сходятся границы планов. Здесь можно встретить существ из других миров. Реальность нестабильна — здания появляются и исчезают.",danger:"very_high"},{name:"Дворец Песчаного Султана",description:"Величественный дворец из белого мрамора в центре пустыни. Фонтаны, сады, сокровищницы. Но за роскошью скрываются интриги.",danger:"medium"},{name:"Древний амфитеатр",description:"Каменные трибуны, поросшие травой. Когда-то здесь выступали барды со всего мира. Акустика идеальна — даже шёпот слышен на последнем ряду.",danger:"low"},{name:"Кладбище Костей",description:"Бесконечное кладбище с тысячами могил. Надгробия покрыты мхом. По ночам мертвецы поднимаются из могил, следуя зову некроманта.",danger:"very_high"},{name:"Лабиринт Минотавра",description:"Бесконечные каменные коридоры, меняющие конфигурацию. На стенах — царапины от когтей. Где-то в глубине ревёт чудовище.",danger:"high"},{name:"Замок на краю мира",description:"Замок, висящий над бездной. Мосты ведут в никуда. Хозяин замка — древний лич, собирающий знания со всех планов.",danger:"very_high"}
